<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Against All TOD</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #16201a;
        --fg: #e8efe9;
        --muted: #9fb3a5;
        --attack: #ff5a36;
        --defense: #3d8bfd;
        --light-wash: #fff3c4;
        --dark: #000000;
        /* The art kit's colours; each matches its constant in src/adapters/renderer/board-view.ts. */
        --grass-light: #8ed36b;
        --grass-dark: #7cc35a;
        --meadow: #5f9f48;
        --board-border: #9a6a3a;
        --wood: #c98b4e;
        --office: #ece6d9;
        --outline: #2a2118;
        --shadow: #1b2a14;
        --leaf: #3e8c3a;
        --petal: #fffaf0;
        --bloom: #ffd44d;
        --carpet: #f5c9b3;
        --hud-height: 80px;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, sans-serif;
      }
      /* PixiJS sizes its canvas to this box; pinch and drag belong to the game, not the browser. */
      #game {
        position: fixed;
        inset: var(--hud-height) 0 0 0;
        touch-action: none;
      }
      #game canvas {
        display: block;
      }
      /* Its own band above the Board, so it never hides a tile. */
      #hud {
        position: fixed;
        inset: 0 0 auto 0;
        height: var(--hud-height);
        box-sizing: border-box;
        padding: 6px 16px 0;
        overflow: hidden;
        text-align: center;
      }
      .hud-top {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        flex-wrap: nowrap;
      }
      #hud {
        --side: var(--defense);
      }
      #hud[data-side="attack"] {
        --side: var(--attack);
      }
      #hud h1 {
        margin: 0;
        font-size: 1rem;
        color: var(--side);
        white-space: nowrap;
      }
      .hud-status {
        font-size: 0.85rem;
        font-weight: 600;
        white-space: nowrap;
      }
      .hud-controls {
        display: flex;
        gap: 6px;
      }
      #hud button {
        font: inherit;
        font-size: 0.85rem;
        padding: 3px 10px;
        border-radius: 6px;
        border: 1px solid var(--muted);
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      #hud button[aria-pressed="true"] {
        border-color: var(--side);
        background: var(--side);
        color: #fff;
      }
      #hud button.hud-fight {
        border-color: var(--attack);
        background: var(--attack);
        color: #fff;
        font-weight: 600;
      }
      #hud button.hud-take-back {
        border-color: var(--side);
        color: var(--side);
      }
      #hud button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      @media (pointer: coarse) {
        #hud button.hud-take-back {
          min-height: 44px;
        }
      }
      #hud p {
        margin: 2px 0 0;
        font-size: 0.85rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--muted);
      }
      #hud .hud-round-hint {
        color: inherit;
        font-weight: 600;
      }
      #hud .hud-message {
        color: var(--attack);
        font-weight: 600;
      }
      /* Keeps its line when hidden, so the band doesn't jump. */
      #hud .hud-message[hidden] {
        display: block;
        visibility: hidden;
      }
      #piece-info {
        position: fixed;
        left: 12px;
        bottom: 12px;
        max-width: 18rem;
        padding: 8px 12px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.75);
        pointer-events: none;
      }
      /* The game's own Settings menu, where the tricks are bought. */
      #settings {
        position: fixed;
        left: 12px;
        top: calc(var(--hud-height) + 8px);
        max-width: min(22rem, calc(100% - 24px));
        font-size: 0.85rem;
      }
      #settings button.settings-toggle {
        min-height: 44px;
        padding: 4px 14px;
        border-radius: 6px;
        border: 1px solid var(--fg);
        background: rgb(0 0 0 / 0.75);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      .settings-panel {
        margin-top: 4px;
        padding: 8px 12px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.85);
      }
      .settings-panel[hidden] {
        display: none;
      }
      .settings-panel h2 {
        margin: 0 0 4px;
        font-size: 0.95rem;
      }
      .settings-panel p {
        margin: 0;
        color: var(--muted);
      }
      .settings-undo-picking {
        margin: 0.5rem 0;
      }

      .settings-slider {
        margin-top: 8px;
      }
      .settings-slider label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 44px;
        font-weight: 600;
      }
      .settings-slider input {
        flex: 1;
        max-width: 10rem;
      }
      /* The pause menu, with the honest volume slider. */
      #pause {
        position: fixed;
        left: 12px;
        bottom: 12px;
        max-width: min(22rem, calc(100% - 24px));
        font-size: 0.85rem;
      }
      #pause button.pause-toggle {
        min-height: 44px;
        padding: 4px 14px;
        border-radius: 6px;
        border: 1px solid var(--fg);
        background: rgb(0 0 0 / 0.75);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      .pause-panel {
        margin-bottom: 4px;
        padding: 8px 12px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.85);
      }
      .pause-panel[hidden] {
        display: none;
      }
      .pause-panel h2 {
        margin: 0 0 4px;
        font-size: 0.95rem;
      }
      .pause-panel label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 44px;
        font-weight: 600;
      }
      /* The swarm debug scene's frame rate. */
      #fps {
        position: fixed;
        right: 12px;
        bottom: 12px;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.75);
        font:
          0.85rem ui-monospace,
          monospace;
        pointer-events: none;
      }
      /* The ?debug=1 buttons. */
      #debug-panel {
        position: fixed;
        right: 12px;
        top: calc(var(--hud-height) + 8px);
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 6px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.75);
        font-size: 0.8rem;
      }
      #debug-panel input {
        width: 4rem;
      }
      /* The Draft Crate, along the bottom so it never hides the HUD. */
      #crate {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        box-sizing: border-box;
        padding: 6px 12px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.75);
        text-align: center;
      }
      #crate h2 {
        margin: 0 0 4px;
        font-size: 0.9rem;
      }
      #crate p {
        margin: 0;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .crate-items {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
      }
      #crate button {
        font: inherit;
        font-size: 0.85rem;
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid var(--fg);
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      #crate button.crate-reroll {
        border-color: var(--muted);
        color: var(--muted);
      }
      #crate[hidden],
      #fps[hidden],
      #debug-panel[hidden],
      #piece-info[hidden],
      #end-screen[hidden],
      #round-report[hidden],
      #turn-device[hidden] {
        display: none;
      }
      #round-report {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 16px;
        overflow-y: auto;
        text-align: center;
        background: rgb(22 32 26 / 0.92);
        cursor: pointer;
      }
      #round-report h1 {
        margin: 0;
        font-size: 1.4rem;
      }
      #round-report h2 {
        margin: 6px 0 0;
        font-size: 0.95rem;
        color: var(--muted);
      }
      #round-report p,
      #round-report ul,
      #round-report dl {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .report-deaths {
        display: grid;
        gap: 1px;
        width: min(360px, 100%);
      }
      .report-deaths span {
        background: var(--attack);
      }
      .report-gold {
        display: flex;
        gap: 24px;
        margin-top: 6px;
      }
      .report-gold dt {
        font-weight: 600;
      }
      .report-gold .defense dt {
        color: var(--defense);
      }
      .report-gold .attack dt {
        color: var(--attack);
      }
      .report-gold dd {
        margin: 0;
      }
      #round-report button {
        font: inherit;
        font-weight: 600;
        margin-top: 8px;
        padding: 6px 20px;
        border-radius: 8px;
        border: none;
        background: var(--attack);
        color: #fff;
        cursor: pointer;
      }
      #end-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px;
        text-align: center;
        background: rgb(22 32 26 / 0.88);
      }
      #end-screen h1 {
        margin: 0;
        font-size: 1.6rem;
      }
      #end-screen p {
        margin: 0;
        font-size: 1.1rem;
        color: var(--muted);
      }
      #end-screen button {
        font: inherit;
        font-size: 1.1rem;
        font-weight: 600;
        padding: 8px 24px;
        border-radius: 8px;
        border: none;
        background: var(--attack);
        color: #fff;
        cursor: pointer;
      }
      #piece-info h2 {
        margin: 0;
        font-size: 0.95rem;
      }
      #piece-info p {
        margin: 2px 0 0;
        font-size: 0.85rem;
        color: var(--muted);
      }
      #turn-device {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 16px;
        text-align: center;
        background: var(--bg);
      }
      #turn-device p {
        margin: 0;
        color: var(--muted);
      }
      #startup-error {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 16px;
        text-align: center;
        background: var(--bg);
      }
      #startup-error[hidden] {
        display: none;
      }
      #startup-error h1 {
        margin: 0;
        font-size: 1.6rem;
        color: var(--attack);
      }
      #startup-error p {
        margin: 0;
        max-width: 40rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="game" aria-label="Against All TOD board"></div>
    <div id="hud"></div>
    <aside id="piece-info" aria-live="polite" hidden></aside>
    <section id="crate" aria-label="Draft Crate" hidden></section>
    <section id="settings" aria-label="Settings"></section>
    <section id="pause" aria-label="Pause"></section>
    <output id="fps" hidden></output>
    <aside id="debug-panel" aria-label="Debug options" hidden></aside>
    <section
      id="end-screen"
      role="dialog"
      aria-label="End of Run"
      hidden
    ></section>
    <section
      id="round-report"
      role="dialog"
      aria-label="Round report"
      hidden
    ></section>
    <section id="turn-device" hidden>
      <h1>Turn your device</h1>
      <p>Against All TOD is played in landscape.</p>
    </section>
    <section id="startup-error" role="alert" hidden>
      <h1>Against All TOD could not start</h1>
      <p id="startup-error-reason"></p>
      <p>Reloading the page may help. The browser console has the details.</p>
    </section>
    <noscript>Against All TOD needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
