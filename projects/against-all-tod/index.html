<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Against All TOD</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #16201a;
        --fg: #e8efe9;
        --muted: #9fb3a5;
        --attack: #ff5a36;
        --defense: #3d8bfd;
        --light-wash: #fff3c4;
        --dark: #000000;
        /* The art kit's colours; each matches its constant in src/adapters/renderer/board-view.ts. */
        --grass-light: #8ed36b;
        --grass-dark: #7cc35a;
        --meadow: #5f9f48;
        --board-border: #9a6a3a;
        --wood: #c98b4e;
        --office: #ece6d9;
        --outline: #2a2118;
        --shadow: #1b2a14;
        --leaf: #3e8c3a;
        --petal: #fffaf0;
        --bloom: #ffd44d;
        --carpet: #f5c9b3;
        --eye: #ffffff;
        --metal: #aab4bd;
        /* The UI kit, on top of the art kit's outline and shadow: raised surfaces, coin gold. */
        --surface: #2a3a31;
        --gold: #ffd23f;
        --press-depth: 4px;
        --font-display: "Fredoka", system-ui, sans-serif;
        /* Chip row, button row and three text lines; see the media queries below. */
        --hud-height: 144px;
      }
      @media (pointer: coarse) {
        :root {
          --hud-height: 156px;
        }
      }
      @media (max-height: 500px) {
        :root {
          --hud-height: 120px;
        }
      }
      /* Bundled, so the game looks the same offline and on itch.io (OFL, see assets/fonts/fredoka). */
      @font-face {
        font-family: "Fredoka";
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url("./assets/fonts/fredoka/fredoka-latin-wght-normal.woff2")
          format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, sans-serif;
      }
      /* PixiJS sizes its canvas to this box; pinch and drag belong to the game, not the browser. */
      #game {
        position: fixed;
        inset: var(--hud-height) 0 0 0;
        touch-action: none;
      }
      #game canvas {
        display: block;
      }
      /* Shared look for every overlay: chunky buttons that press in, chips and cards. */
      h1,
      h2 {
        font-family: var(--font-display);
      }
      .btn {
        box-sizing: border-box;
        min-height: 36px;
        padding: 4px 14px;
        border: 3px solid var(--outline);
        border-radius: 12px;
        background: var(--surface);
        box-shadow: 0 var(--press-depth) 0 var(--outline);
        color: var(--fg);
        font-family: var(--font-display);
        font-size: 0.95rem;
        font-weight: 600;
        line-height: 1.1;
        white-space: nowrap;
        cursor: pointer;
        touch-action: manipulation;
        transition:
          transform 60ms,
          box-shadow 60ms;
      }
      .btn:active:not(:disabled) {
        transform: translateY(var(--press-depth));
        box-shadow: 0 0 0 var(--outline);
      }
      .btn:focus-visible {
        outline: 3px solid var(--fg);
        outline-offset: 2px;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      /* The chosen one of a set wears the side's colour; --side is set by the overlay. */
      .btn[aria-pressed="true"] {
        background: var(--side);
        color: #fff;
      }
      @media (pointer: coarse) {
        .btn {
          min-height: 44px;
        }
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        box-sizing: border-box;
        height: 28px;
        padding: 0 10px;
        border: 2px solid var(--outline);
        border-radius: 999px;
        background: var(--surface);
        color: var(--fg);
        font-family: var(--font-display);
        font-size: 0.95rem;
        font-weight: 600;
        white-space: nowrap;
      }
      .card {
        box-sizing: border-box;
        padding: 12px 16px;
        border: 3px solid var(--outline);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: 0 6px 0 var(--shadow);
        color: var(--fg);
      }
      /* Its own band above the Board, so it never hides a tile. */
      #hud {
        --side: var(--defense);
        position: fixed;
        inset: 0 0 auto 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-content: start;
        justify-items: center;
        row-gap: 4px;
        height: var(--hud-height);
        box-sizing: border-box;
        padding: 6px 16px 0;
        overflow: hidden;
        text-align: center;
      }
      #hud[data-side="attack"] {
        --side: var(--attack);
      }
      .hud-top,
      .hud-status,
      .hud-controls {
        display: flex;
        align-items: center;
        gap: 6px;
        max-width: 100%;
      }
      .hud-status {
        margin: 0;
        padding: 0;
        list-style: none;
        gap: 4px;
      }
      .chip-icon {
        font-size: 0.9em;
      }
      .chip-score .chip-icon {
        color: var(--gold);
      }
      .chip-defense-gold {
        border-color: var(--defense);
      }
      .chip-attack-gold {
        border-color: var(--attack);
      }
      /* The turn, in the side's colour. */
      #hud .hud-turn {
        margin: 0;
        background: var(--side);
        color: #fff;
        font-size: 1rem;
      }
      /* Room under the buttons for their shadow. */
      .hud-controls {
        padding-bottom: var(--press-depth);
      }
      /* A long shop scrolls sideways; Take back and Fight stay in reach after it. */
      .hud-choices {
        display: flex;
        gap: 6px;
        min-width: 0;
        overflow-x: auto;
        padding-bottom: var(--press-depth);
        margin-bottom: calc(-1 * var(--press-depth));
        scrollbar-width: none;
      }
      #hud .hud-fight {
        background: var(--attack);
        color: #fff;
      }
      #hud .hud-take-back {
        color: var(--side);
      }
      #hud p {
        justify-self: stretch;
        margin: 0;
        font-size: 0.85rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--muted);
      }
      #hud .hud-round-hint {
        color: inherit;
        font-weight: 600;
      }
      #hud .hud-message {
        color: var(--attack);
        font-weight: 600;
      }
      /* Keeps its line when hidden, so the band doesn't jump. */
      #hud .hud-message[hidden] {
        display: block;
        visibility: hidden;
      }
      /* A phone on its side: the chips and the buttons share one row. */
      @media (max-height: 500px) {
        #hud {
          grid-template-columns: auto minmax(0, 1fr);
          column-gap: 8px;
          padding: 4px 12px 0;
        }
        #hud .hud-controls {
          justify-self: start;
        }
        #hud p {
          grid-column: 1 / -1;
        }
      }
      #piece-info {
        position: fixed;
        left: 12px;
        bottom: 12px;
        max-width: 18rem;
        padding: 8px 12px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.75);
        pointer-events: none;
      }
      /* The game's own Settings menu, where the tricks are bought. */
      #settings {
        position: fixed;
        left: 12px;
        top: calc(var(--hud-height) + 8px);
        max-width: min(22rem, calc(100% - 24px));
        max-height: calc(100% - var(--hud-height) - 20px);
        overflow-y: auto;
        font-size: 0.85rem;
      }
      .settings-panel {
        margin-top: 6px;
      }
      .settings-panel[hidden] {
        display: none;
      }
      .settings-panel h2 {
        margin: 0 0 4px;
        font-size: 1.1rem;
      }
      .settings-panel p {
        margin: 0;
        color: var(--muted);
      }
      .settings-panel .icon {
        flex: none;
        width: 26px;
        height: 26px;
      }
      .settings-undo-picking {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin: 0.5rem 0;
      }
      .settings-slider {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 2px dashed rgb(255 255 255 / 0.12);
      }
      .settings-name {
        font-family: var(--font-display);
        font-size: 1rem;
        font-weight: 600;
      }
      /* The track runs from the colour of the side the down end helps to the up end's. */
      .settings-track {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 18px;
      }
      .settings-rail {
        position: relative;
        flex: 1;
      }
      .settings-rail input {
        display: block;
        width: 100%;
        height: 44px;
        margin: 0;
        appearance: none;
        background: transparent;
        touch-action: manipulation;
        cursor: pointer;
      }
      .settings-rail input:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .settings-rail input::-webkit-slider-runnable-track {
        height: 14px;
        border: 3px solid var(--outline);
        border-radius: 999px;
        background: linear-gradient(
          to right,
          var(--down-side),
          var(--surface) 50%,
          var(--up-side)
        );
      }
      .settings-rail input::-moz-range-track {
        height: 14px;
        border: 3px solid var(--outline);
        border-radius: 999px;
        background: linear-gradient(
          to right,
          var(--down-side),
          var(--surface) 50%,
          var(--up-side)
        );
      }
      .settings-rail input::-webkit-slider-thumb {
        width: 28px;
        height: 28px;
        margin-top: -10px;
        appearance: none;
        border: 3px solid var(--outline);
        border-radius: 50%;
        background: var(--petal);
      }
      .settings-rail input::-moz-range-thumb {
        box-sizing: border-box;
        width: 28px;
        height: 28px;
        border: 3px solid var(--outline);
        border-radius: 50%;
        background: var(--petal);
      }
      /* Rides the handle; shifting by its own share keeps it inside the card at either end. */
      .settings-price {
        position: absolute;
        left: var(--handle);
        bottom: calc(100% - 6px);
        transform: translateX(calc(-1 * var(--handle)));
        height: 24px;
        padding: 0 8px;
        background: var(--gold);
        color: var(--outline);
        font-size: 0.8rem;
        pointer-events: none;
      }
      .settings-price .icon {
        width: 16px;
        height: 16px;
      }
      /* Red and on its own line, so it never reads as Take back. */
      .settings-undo {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
        background: #d63a2f;
        color: #fff;
        white-space: normal;
        text-align: left;
      }
      /* The pause menu, with the honest volume slider. */
      #pause {
        position: fixed;
        left: 12px;
        bottom: 12px;
        max-width: min(22rem, calc(100% - 24px));
        font-size: 0.85rem;
      }
      #pause button.pause-toggle {
        min-height: 44px;
        padding: 4px 14px;
        border-radius: 6px;
        border: 1px solid var(--fg);
        background: rgb(0 0 0 / 0.75);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      .pause-panel {
        margin-bottom: 4px;
        padding: 8px 12px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.85);
      }
      .pause-panel[hidden] {
        display: none;
      }
      .pause-panel h2 {
        margin: 0 0 4px;
        font-size: 0.95rem;
      }
      .pause-panel label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 44px;
        font-weight: 600;
      }
      /* The swarm debug scene's frame rate. */
      #fps {
        position: fixed;
        right: 12px;
        bottom: 12px;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.75);
        font:
          0.85rem ui-monospace,
          monospace;
        pointer-events: none;
      }
      /* The ?debug=1 buttons. */
      #debug-panel {
        position: fixed;
        right: 12px;
        top: calc(var(--hud-height) + 8px);
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 6px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.75);
        font-size: 0.8rem;
      }
      #debug-panel input {
        width: 4rem;
      }
      /* The Draft Crate, along the bottom so it never hides the HUD. */
      #crate {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        box-sizing: border-box;
        padding: 6px 12px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.75);
        text-align: center;
      }
      #crate h2 {
        margin: 0 0 4px;
        font-size: 0.9rem;
      }
      #crate p {
        margin: 0;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .crate-items {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
      }
      #crate button {
        font: inherit;
        font-size: 0.85rem;
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid var(--fg);
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      #crate button.crate-reroll {
        border-color: var(--muted);
        color: var(--muted);
      }
      #crate[hidden],
      #fps[hidden],
      #debug-panel[hidden],
      #piece-info[hidden],
      #end-screen[hidden],
      #round-report[hidden],
      #turn-device[hidden] {
        display: none;
      }
      #round-report {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 16px;
        overflow-y: auto;
        text-align: center;
        background: rgb(22 32 26 / 0.92);
        cursor: pointer;
      }
      #round-report h1 {
        margin: 0;
        font-size: 1.4rem;
      }
      #round-report h2 {
        margin: 6px 0 0;
        font-size: 0.95rem;
        color: var(--muted);
      }
      #round-report p,
      #round-report ul,
      #round-report dl {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .report-deaths {
        display: grid;
        gap: 1px;
        width: min(360px, 100%);
      }
      .report-deaths span {
        background: var(--attack);
      }
      .report-gold {
        display: flex;
        gap: 24px;
        margin-top: 6px;
      }
      .report-gold dt {
        font-weight: 600;
      }
      .report-gold .defense dt {
        color: var(--defense);
      }
      .report-gold .attack dt {
        color: var(--attack);
      }
      .report-gold dd {
        margin: 0;
      }
      #round-report button {
        font: inherit;
        font-weight: 600;
        margin-top: 8px;
        padding: 6px 20px;
        border-radius: 8px;
        border: none;
        background: var(--attack);
        color: #fff;
        cursor: pointer;
      }
      #end-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px;
        text-align: center;
        background: rgb(22 32 26 / 0.88);
      }
      #end-screen h1 {
        margin: 0;
        font-size: 1.6rem;
      }
      #end-screen p {
        margin: 0;
        font-size: 1.1rem;
        color: var(--muted);
      }
      #end-screen button {
        font: inherit;
        font-size: 1.1rem;
        font-weight: 600;
        padding: 8px 24px;
        border-radius: 8px;
        border: none;
        background: var(--attack);
        color: #fff;
        cursor: pointer;
      }
      #piece-info h2 {
        margin: 0;
        font-size: 0.95rem;
      }
      #piece-info p {
        margin: 2px 0 0;
        font-size: 0.85rem;
        color: var(--muted);
      }
      #turn-device {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 16px;
        text-align: center;
        background: var(--bg);
      }
      #turn-device p {
        margin: 0;
        color: var(--muted);
      }
      #startup-error {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 16px;
        text-align: center;
        background: var(--bg);
      }
      #startup-error[hidden] {
        display: none;
      }
      #startup-error h1 {
        margin: 0;
        font-size: 1.6rem;
        color: var(--attack);
      }
      #startup-error p {
        margin: 0;
        max-width: 40rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="game" aria-label="Against All TOD board"></div>
    <div id="hud"></div>
    <aside id="piece-info" aria-live="polite" hidden></aside>
    <section id="crate" aria-label="Draft Crate" hidden></section>
    <section id="settings" aria-label="Settings"></section>
    <section id="pause" aria-label="Pause"></section>
    <output id="fps" hidden></output>
    <aside id="debug-panel" aria-label="Debug options" hidden></aside>
    <section
      id="end-screen"
      role="dialog"
      aria-label="End of Run"
      hidden
    ></section>
    <section
      id="round-report"
      role="dialog"
      aria-label="Round report"
      hidden
    ></section>
    <section id="turn-device" hidden>
      <h1>Turn your device</h1>
      <p>Against All TOD is played in landscape.</p>
    </section>
    <section id="startup-error" role="alert" hidden>
      <h1>Against All TOD could not start</h1>
      <p id="startup-error-reason"></p>
      <p>Reloading the page may help. The browser console has the details.</p>
    </section>
    <noscript>Against All TOD needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
