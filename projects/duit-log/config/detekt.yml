# Overrides on top of detekt's default rules (buildUponDefaultConfig = true).
naming:
  FunctionNaming:
    # Compose functions are named like types (HomeScreen).
    ignoreAnnotated: ['Composable']

style:
  UnusedPrivateMember:
    # @Preview functions are used by the IDE, not by code.
    ignoreAnnotated: ['Preview']
  MagicNumber:
    # Colours are hex numbers given a name where they are declared (val Green = Color(0xFF1B7F5A)).
    ignorePropertyDeclaration: true
