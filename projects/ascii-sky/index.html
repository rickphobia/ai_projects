<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASCII Sky</title>
    <style>
      /* One colour on black, like a plain terminal (spec: "The Screen"). */
      :root {
        color-scheme: dark;
        --bg: #000;
        --fg: #c8c8c8;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
      }
      /* Laid out at its natural size; the Screen adapter scales it to fit with a transform. */
      #screen {
        flex: none;
        margin: 0;
        font-family:
          ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
        font-size: 16px;
        line-height: 1.15;
        white-space: pre;
        transform-origin: center;
      }
    </style>
  </head>
  <body>
    <pre id="screen" aria-label="ASCII Sky screen"></pre>
    <noscript>ASCII Sky needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
